- type: entity
  parent: [ ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseCargoContraband ]
  id: LavalandEquipmentExplorerSuit
  suffix: Lava
  name: explorer suit
  description: An armoured suit for exploring harsh environments.
  components:
  - type: Sprite
    sprite: _Lavaland/Equipment/explorer_suit.rsi
    state: icon
  - type: Clothing
    sprite: _Lavaland/Equipment/explorer_suit.rsi
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Leg
    - Tail
    traumaDeductions:
      Dismemberment: 0.25
      OrganDamage: 0.25
      BoneDamage: 0.25
      VeinsDamage: 0
    modifiers:
      flatReductions:
        Blunt: 12
        Slash: 12
        Piercing: 12
        Heat: 12
        Caustic: 12
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container {}
  - type: ToggleableClothing
    clothingPrototypes:
      head: LavalandEquipmentExplorerHood
  - type: Construction
    graph: ExplorerSuit
    node: start
  - type: FireProtection
    reduction: 0.5
  - type: PressureArmorChange
  - type: PressureEfficiency
  - type: Tag
    tags:
    - ExplorerSuit

