## Parent File to easily add more attributes, here it's used for plasmaman mostly
- type: entity
  abstract: true
  parent: ClothingOuterBase
  id: ClothingOuterModsuitBase
  components:
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/standard.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: ComponentToggler
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coefficient: 0.01
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: SealableClothing
    sealUpPopup: sealable-clothing-seal-up-chestplate
    sealDownPopup: sealable-clothing-seal-down-chestplate
  - type: FireProtection
    reduction: 0.63
  - type: StaminaResistance
    damageCoefficient: 0.9
  - type: SealableClothingVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-sealed-vox
  - type: Armor
    coverage:
    - Torso
    - Arm
    - Leg
    - Tail
    - Wings
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
  - type: Tag
    tags:
    - PlasmamanSafe
  - type: IgniteFromGasImmunity
    parts:
    - Torso
    - LegLeft
    - LegRight

- type: entity
  parent: ClothingOuterModsuitBase
  id: ClothingModsuitChestplateStandard
  name: standard modsuit chestplate
  description: A special modular suit spaceproof cover designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  - type: Armor
    modifiers:
      flatReductions:
        Blunt: 3
        Slash: 3
        Piercing: 3
        Heat: 3
        Radiation: 30

