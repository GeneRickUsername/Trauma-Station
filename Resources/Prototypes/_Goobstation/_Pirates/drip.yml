- type: entity
  parent: ClothingOuterHardsuitBase
  id: GoobClothingOuterHardsuitSpirate
  name: modified EVA suit
  description: A modified suit to allow space pirates to board shuttles and stations while avoiding the maw of the void. Comes with additional protection and is lighter to move in.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Hardsuits/piratecaptain.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/OuterClothing/Hardsuits/piratecaptain.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
    modifiers:
      flatReductions:
        Blunt: 12
        Slash: 12
        Piercing: 12
        Ballistic: 10
        Heat: 10
        Caustic: 12
  - type: ClothingSpeedModifier
    walkModifier: 0.90
    sprintModifier: 0.90
  - type: ToggleableClothing
    clothingPrototypes:
      head: GoobClothingHeadHelmetHardsuitSpirate

- type: entity
  parent: ClothingHeadHelmetBase
  id: GoobClothingHeadHelmetHardsuitSpirate
  name: modified EVA helmet
  description: A modified helmet to allow space pirates to intimidate their customers whilst staying safe from the void. Comes with some additional protection.
  components:
  - type: Sprite
    sprite: _Goobstation/_Pirates/spirate_suit.rsi
    state: icon_head
  - type: Clothing
    sprite: _Goobstation/_Pirates/spirate_suit.rsi
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
    modifiers:
      flatReductions:
        Blunt: 14
        Slash: 14
        Piercing: 14
        Ballistic: 20
        Heat: 20
        Caustic: 14

- type: entity
  id: GoobSuitStorageSpirate
  parent: SuitStorageBase
  suffix: Spirate
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: OxygenTankFilled
        - id: NitrogenTankFilled
        - id: GoobClothingOuterHardsuitSpirate
        - id: ClothingMaskBreath
