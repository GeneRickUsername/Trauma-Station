#CREW HARDSUITS
#Atmospherics Hardsuit
- type: entity
  parent: [ ClothingHeadHardsuitInsulatedBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitAtmos
  name: atmospherics hardsuit helmet # Goob edit
  description: A special hardsuit helmet designed for working in low-pressure and high-temperature environments. # Goob edit
  components:
  # <Trauma>
  - type: EyeProtection
  - type: ExplosionResistance
    damageCoefficient: 0.5
  # </Trauma>
  - type: Sprite
    sprite: Clothing/Head/Hardsuits/atmospherics.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
  - type: PointLight
    color: "#adffe6"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: FireProtection
    reduction: 1 # Trauma - was 0.2, 5x for limb coverage
  - type: Armor
    modifiers:
      flatReductions:
        Blunt: 3
        Slash: 3
        Piercing: 3
        Heat: 5
        Radiation: 20
  - type: Tag
    tags:
    - CorgiWearable
    - WhitelistChameleon

