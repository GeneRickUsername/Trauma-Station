# Default for any species that has no knowledge profile of its own
- type: knowledgeProfile
  id: Human
  pointsLimit: 100 # Most points to work with for customization.
  attributes:
    StrengthAttribute: 0
    IntelligenceAttribute: 0
    WisdomAttribute: 0
    DexterityAttribute: 0
    ConstitutionAttribute: 0
    LooksAttribute: 0
    CharismaAttribute: 0
  skillRolls:
    # Crafting Recipe Skills - 1 is standard unless stated otherwise.
    DoorsKnowledge: 1
    AirlocksKnowledge: 1
    FurnitureKnowledge: 1
    InfrastructureKnowledge: 1
    ElectronicsKnowledge: 1
    WallsKnowledge: 1
    WindowsKnowledge: 1
    # Intelectual Skills
    LiteracyKnowledge: 12
    # Language Skills
    LanguageSolCommon: 12
    # Crafting Quality
    ManufacturingKnowledge: 3
    ConstructionKnowledge: 3
    MechanicsKnowledge: 3
    ScienceKnowledge: 10 # SCIENCE!
    ElectronicsKnowledge: 3
